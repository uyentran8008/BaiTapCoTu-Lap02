<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <STYLE>
        body{
            background-color: antiquewhite;
            font-family: 'time new roman' 'Times New Roman', Times, serif;

        }

       .container{
        border:5px solid black;
        width: 90%;
        background-color: aquamarine;
        margin: 10px auto;
       }
       .banner{
        background-color: lightgray;
        height: 100px;

       }
       .navigator{
        text-align: left;
        background-color: rgb(219, 149, 219);
        height: 60px;

       }
       .sideber{
        background-color: gray;
        display: block;
        text-align: left;
        float: left;
        width: 20%;

       }
       .content{
        background-color: whitesmoke;
        width: 80%-10%;
        min-height:450px;
        margin-left: 20%;
        padding-top: 5px;

       }
       .footer{
        text-align: center;

       }
    </STYLE>
</head>
<body>
    <div class="container">
        <div class="banner">BANNER</div>
        <div class="navigator">NAVIGATOR</div>
        <div class="sideber">SIDEBER</div>
        <div class="content">CONTENT</div>
        <div class="footer">FOOTER</div>
    </div>
</body>
</html>
