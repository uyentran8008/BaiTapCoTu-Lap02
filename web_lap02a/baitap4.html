<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #menu a {
            color: white;
            background-color: lightslategray;
            text-decoration: none;
            width: 100px;
            text-align: center;
            margin: 10px ;
            position:  relative;
            display: block;
            padding: 5px;
            border:3px solid black;
            border-color: pink ;
        }
        #menu a:visited{
            color: red;

        }
         #menu a:link{
            color: green;
         }

         #menu a:hover{
            color: orange;
            top:5px;
            left:5px;
            background-color: rgb(165, 73, 73);

         }
    </style>
</head>

<body>
    <div id="menu">
        <a href="#">home</a>
        <a href="#">About</a>
        <a href="#">History</a>
        <a href="#">Team</a>
        <a href="#">Offices</a>
    </div>
</body>

</html>
